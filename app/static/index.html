<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketLens — Competitor Monitoring Alert Tool</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/birchline.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>MarketLens</span>
          <span class="brand-badge">AI ALERT</span>
        </div>
        <div class="label" style="margin-top: 4px;">Competitor Monitoring</div>
      </div>

      <!-- Add Competitor Input Form -->
      <div class="sidebar-add-box">
        <form id="form-add-comp" style="display: flex; flex-direction: column; gap: 8px;">
          <input
            type="text"
            id="input-domain"
            class="input"
            placeholder="domain.com (e.g. buffer.com)"
            required
            autocomplete="off"
          />
          <button type="submit" id="btn-add-comp" class="btn btn-primary" style="width: 100%;">
            Add & Index
          </button>
        </form>
      </div>

      <!-- Competitors List -->
      <div class="sidebar-list" id="competitors-list">
        <!-- Rendered dynamically by app.js -->
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div id="system-status-pills" style="display: flex; flex-direction: column; gap: 4px;">
          <!-- Status badges rendered dynamically -->
        </div>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <button class="btn btn-secondary btn-sm" onclick="sendAlert('email')" style="flex: 1;" title="Send competitor alert to email">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            Send Email
          </button>
          <button class="btn btn-secondary btn-sm" onclick="sendAlert('slack')" style="flex: 1;" title="Send competitor alert to Slack">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/><path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/><path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/><path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/></svg>
            Send Slack
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content-view">
      <!-- Main view rendered dynamically by app.js -->
    </main>
  </div>

  <!-- Dispatch Alert Modal -->
  <div class="modal-overlay" id="modal-test-alert" style="display: none;">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="margin: 0; font-size: 20px;">Dispatch Competitor Alert</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-test-alert')">Close</button>
      </div>
      <p style="font-size: 14px; color: var(--gray-700); margin-bottom: 20px;">
        Trigger real-time alert delivery for the currently selected competitor across your configured channels:
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-primary" onclick="sendAlert('email')">
          Send Email Digest
        </button>
        <button class="btn btn-secondary" onclick="sendAlert('slack')">
          Send Slack Alert
        </button>
      </div>
      <div style="margin-top: 20px; font-size: 12px; color: var(--gray-500); font-family: var(--mono); text-align: center;">
        Monitored channels configured in system environment
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
