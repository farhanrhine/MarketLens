services:
  - type: web
    name: marketlens
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: MarketLens
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./marketlens.db
      - key: SEO_PROVIDER
        value: mock
